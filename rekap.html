<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rekap Absensi - Absensi IRMA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.8"></script>
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body class="bg-gray-50 min-h-screen halaman-tabbar">
    <header class="bg-emerald-600 text-white shadow-md">
      <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between flex-wrap gap-2">
        <div class="flex items-center gap-2 font-bold text-lg">🕌 Absensi IRMA</div>
        <nav class="flex items-center gap-1 text-sm nav-scroll min-w-0 whitespace-nowrap pb-1">
          <a href="/dashboard" class="px-3 py-1.5 rounded-lg hover:bg-emerald-700 transisi">Dashboard</a>
          <a href="/users" class="px-3 py-1.5 rounded-lg hover:bg-emerald-700 transisi">Akun</a>
          <a href="/siswa" class="px-3 py-1.5 rounded-lg hover:bg-emerald-700 transisi">Siswa</a>
          <a href="/tambah" class="px-3 py-1.5 rounded-lg hover:bg-emerald-700 transisi">Input Absensi</a>
          <a href="/rekap" class="px-3 py-1.5 rounded-lg bg-emerald-700 font-semibold">Rekap</a>
          <a href="/kegiatan" class="px-3 py-1.5 rounded-lg hover:bg-emerald-700 transisi">Kegiatan</a>
          <a href="/export" class="px-3 py-1.5 rounded-lg hover:bg-emerald-700 transisi">Export</a>
          <button onclick="logout()" class="px-3 py-1.5 rounded-lg bg-red-500 hover:bg-red-600 font-semibold transisi">Logout</button>
        </nav>
      </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 py-8">
      <div class="flex items-center justify-between mb-6 flex-wrap gap-2">
        <h1 class="text-xl sm:text-2xl font-bold text-gray-800">Rekap Absensi</h1>
        <span id="status-jaringan" class="text-xs sm:text-sm font-semibold text-emerald-700 bg-emerald-50 px-3 py-1 rounded-full">🌐 Online</span>
      </div>

      <div id="sync-notif" class="hidden mb-4 bg-emerald-50 text-emerald-700 text-sm px-4 py-2 rounded-lg border border-emerald-200"></div>
      <div id="antrean-info" class="hidden mb-4 bg-amber-50 text-amber-700 text-sm px-4 py-2 rounded-lg border border-amber-200"></div>

      <!-- MODAL EDIT SEDERHANA -->
      <div id="modal-edit" class="hidden fixed inset-0 bg-black/40 flex items-center justify-center px-4 z-10">
        <div class="bg-white rounded-2xl shadow-xl p-6 w-full max-w-sm">
          <h2 class="font-semibold text-gray-700 mb-4">Edit Absensi</h2>
          <form id="form-edit" class="space-y-3">
            <input type="hidden" id="edit_id" />
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Tanggal</label>
              <input type="date" id="edit_tanggal" required class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-emerald-600" />
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Status</label>
              <select id="edit_status" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-emerald-600">
                <option value="Hadir">Hadir</option>
                <option value="Sakit">Sakit</option>
                <option value="Izin">Izin</option>
                <option value="Alfa">Alfa</option>
              </select>
            </div>
            <div class="flex gap-2 pt-2">
              <button type="submit" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2 rounded-lg transisi">Update</button>
              <button type="button" onclick="tutupModal()" class="flex-1 bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold py-2 rounded-lg transisi">Batal</button>
            </div>
          </form>
        </div>
      </div>

      <!-- PENCARIAN REKAP -->
      <div class="bg-white rounded-2xl shadow border border-gray-100 p-4 mb-4">
        <div class="rekap-cari">
          <label for="cari-rekap">Cari Rekap</label>
          <input
            type="search"
            id="cari-rekap"
            placeholder="Cari tanggal, nama siswa, kelas, atau status..."
            autocomplete="off"
          />
          <span id="info-pencarian-rekap" class="rekap-cari-info" hidden></span>
        </div>
      </div>

      <!-- TABEL REKAP: dipakai di laptop maupun handphone.
           Di handphone tabelnya diperkecil agar semua kolom tetap terlihat. -->
      <div class="bg-white rounded-2xl shadow border border-gray-100 overflow-hidden">
        <div class="overflow-x-auto">
          <table class="rekap-tabel w-full text-sm">
            <thead class="bg-emerald-50 text-emerald-800">
              <tr>
                <th class="text-left px-4 py-3 font-semibold">Tanggal</th>
                <th class="text-left px-4 py-3 font-semibold">Nama Siswa</th>
                <th class="text-left px-4 py-3 font-semibold">Kelas</th>
                <th class="text-left px-4 py-3 font-semibold">Status</th>
                <th class="text-right px-4 py-3 font-semibold">Aksi</th>
              </tr>
            </thead>
            <tbody id="tabel-body" class="divide-y divide-gray-100">
              <tr>
                <td colspan="5" class="text-center py-6 text-gray-400">Memuat data...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>

    <script src="assets/js/navbar.js"></script>
    <script src="assets/js/supabase-client.js"></script>
    <script src="assets/js/offline-store.js"></script>
    <script src="assets/js/app.js"></script>
    <script>
      async function init() {
        const session = await requireAuth();
        if (!session) return;
        initNetworkStatus("status-jaringan");
        perbaruiInfoAntrean();
        document.getElementById("cari-rekap").addEventListener("input", renderRekap);
        await muatRekap();
      }

      function perbaruiInfoAntrean() {
        const info = document.getElementById("antrean-info");
        const jumlah = jumlahAntreanOffline();
        if (jumlah > 0) {
          info.textContent = `⚠️ ${jumlah} perubahan menunggu disinkronkan saat online.`;
          info.classList.remove("hidden");
        } else {
          info.classList.add("hidden");
        }
      }

      const warnaStatus = {
        Hadir: "bg-emerald-100 text-emerald-800",
        Sakit: "bg-amber-100 text-amber-800",
        Izin: "bg-blue-100 text-blue-800",
        Alfa: "bg-red-100 text-red-800",
      };

      // Data lengkap disimpan terpisah dari hasil filter agar pencarian
      // hanya mengubah tampilan, bukan menghapus data asli.
      let semuaRekapCache = [];

      async function muatRekap() {
        const [absensi, siswa] = await Promise.all([dbSelect("tabel_absensi"), dbSelect("tabel_siswa")]);

        const petaSiswa = {};
        siswa.forEach((s) => (petaSiswa[s.id] = s));

        semuaRekapCache = absensi.map((a) => ({ ...a, tabel_siswa: petaSiswa[a.siswa_id] || null }));
        renderRekap();
      }

      function renderRekap() {
        const tbody = document.getElementById("tabel-body");
        const info = document.getElementById("info-pencarian-rekap");
        const kolomCari = document.getElementById("cari-rekap");
        const kata = kolomCari ? kolomCari.value : "";
        const sedangMencari = String(kata).trim().length > 0;
        const data = cariRekapAbsensi(semuaRekapCache, kata);

        if (info) {
          info.textContent = sedangMencari ? `${data.length} dari ${semuaRekapCache.length} data cocok` : "";
          info.hidden = !sedangMencari;
        }

        if (data.length === 0) {
          const pesan =
            semuaRekapCache.length === 0
              ? "Belum ada data absensi."
              : "Tidak ada data yang cocok dengan pencarian.";
          tbody.innerHTML = `<tr><td colspan="5" class="text-center py-6 text-gray-400">${pesan}</td></tr>`;
          return;
        }

        // Satu tabel yang sama dipakai di semua ukuran layar.
        tbody.innerHTML = data
          .map(
            (a) => `
      <tr>
        <td class="px-4 py-3 rekap-tanggal">${formatTanggalIndonesiaRekap(a.tanggal_kegiatan) || "-"}</td>
        <td class="px-4 py-3">${escapeHtml(a.tabel_siswa?.nama_siswa || "-")}${a._pending ? ' <span class="text-xs text-amber-600">(belum sinkron)</span>' : ""}</td>
        <td class="px-4 py-3">${escapeHtml(a.tabel_siswa?.kelas || "-")}</td>
        <td class="px-4 py-3"><span class="rekap-status px-2.5 py-1 rounded-full text-xs font-semibold ${warnaStatus[a.status_kehadiran] || ""}">${a.status_kehadiran}</span></td>
        <td class="rekap-aksi px-4 py-3 text-right space-x-2">
          <button onclick='bukaModal(${JSON.stringify({ id: a.id, tanggal_kegiatan: a.tanggal_kegiatan, status_kehadiran: a.status_kehadiran })})' class="text-emerald-700 font-semibold hover:underline">Edit</button>
          <button onclick="hapusAbsensi('${a.id}')" class="text-red-600 font-semibold hover:underline">Hapus</button>
        </td>
      </tr>
    `,
          )
          .join("");
      }

      function escapeHtml(str) {
        return String(str).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
      }

      function bukaModal(item) {
        document.getElementById("edit_id").value = item.id;
        document.getElementById("edit_tanggal").value = item.tanggal_kegiatan;
        document.getElementById("edit_status").value = item.status_kehadiran;
        document.getElementById("modal-edit").classList.remove("hidden");
      }

      function tutupModal() {
        document.getElementById("modal-edit").classList.add("hidden");
      }

      document.getElementById("form-edit").addEventListener("submit", async (e) => {
        e.preventDefault();
        const id = document.getElementById("edit_id").value;
        const tanggal_kegiatan = document.getElementById("edit_tanggal").value;
        const status_kehadiran = document.getElementById("edit_status").value;

        await dbUpdate("tabel_absensi", id, { tanggal_kegiatan, status_kehadiran });
        tutupModal();
        perbaruiInfoAntrean();
        muatRekap();
      });

      async function hapusAbsensi(id) {
        if (!confirm("Hapus data absensi ini?")) return;
        await dbDelete("tabel_absensi", id);
        perbaruiInfoAntrean();
        muatRekap();
      }

      init();
    </script>
  </body>
</html>
