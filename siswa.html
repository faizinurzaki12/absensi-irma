<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Data Siswa - Absensi IRMA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.8"></script>
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body class="bg-gray-50 min-h-screen">
    <header class="bg-emerald-600 text-white shadow-md">
      <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between flex-wrap gap-2">
        <div class="flex items-center gap-2 font-bold text-lg">🕌 Absensi IRMA</div>
        <nav class="flex items-center gap-1 text-sm flex-wrap">
          <a href="/users" class="px-3 py-1.5 rounded-lg hover:bg-emerald-700 transisi">Akun</a>
          <a href="/siswa" class="px-3 py-1.5 rounded-lg bg-emerald-700 font-semibold">Siswa</a>
          <a href="/tambah" class="px-3 py-1.5 rounded-lg hover:bg-emerald-700 transisi">Input Absensi</a>
          <a href="/rekap" class="px-3 py-1.5 rounded-lg hover:bg-emerald-700 transisi">Rekap</a>
          <a href="/export" class="px-3 py-1.5 rounded-lg hover:bg-emerald-700 transisi">Export</a>
          <button onclick="logout()" class="px-3 py-1.5 rounded-lg bg-red-500 hover:bg-red-600 font-semibold transisi">Logout</button>
        </nav>
      </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-8">
      <div class="flex items-center justify-between mb-6 flex-wrap gap-2">
        <h1 class="text-xl sm:text-2xl font-bold text-gray-800">Manajemen Data Siswa</h1>
        <span id="status-jaringan" class="text-xs sm:text-sm font-semibold text-emerald-700 bg-emerald-50 px-3 py-1 rounded-full">🌐 Online</span>
      </div>

      <div id="sync-notif" class="hidden mb-4 bg-emerald-50 text-emerald-700 text-sm px-4 py-2 rounded-lg border border-emerald-200"></div>
      <div id="antrean-info" class="hidden mb-4 bg-amber-50 text-amber-700 text-sm px-4 py-2 rounded-lg border border-amber-200"></div>

      <!-- FORM TAMBAH SISWA BARU -->
      <div class="bg-white rounded-2xl shadow p-4 sm:p-6 border border-gray-100 mb-6">
        <h2 class="font-semibold text-gray-700 mb-3">Tambah Siswa Baru</h2>
        <form id="form-siswa" class="flex flex-col sm:flex-row gap-3">
          <input type="text" id="nama_siswa" required placeholder="Nama siswa" class="flex-1 border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-emerald-600 transisi" />
          <input type="text" id="kelas" required placeholder="Kelas (mis. VII-A)" class="w-full sm:w-40 border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-emerald-600 transisi" />
          <button type="submit" id="btn-submit-siswa" class="bg-emerald-600 hover:bg-emerald-700 text-white font-semibold px-5 py-2 rounded-lg transisi whitespace-nowrap">Simpan</button>
        </form>
      </div>

      <!-- MODAL POPUP EDIT SISWA -->
      <div id="modal-edit" class="hidden fixed inset-0 bg-black/40 flex items-center justify-center px-4 z-50">
        <div class="bg-white rounded-2xl shadow-xl p-6 w-full max-w-sm">
          <h2 class="font-semibold text-gray-700 mb-4">Edit Data Siswa</h2>
          <form id="form-edit" class="space-y-3">
            <input type="hidden" id="edit_id" />
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Nama Siswa</label>
              <input type="text" id="edit_nama" required class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-emerald-600" />
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Kelas</label>
              <input type="text" id="edit_kelas" required class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-emerald-600" />
            </div>
            <div class="flex gap-2 pt-2">
              <button type="submit" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2 rounded-lg transisi">Update</button>
              <button type="button" onclick="tutupModal()" class="flex-1 bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold py-2 rounded-lg transisi">Batal</button>
            </div>
          </form>
        </div>
      </div>

      <!-- LIST / TABEL SISWA -->
      <div class="bg-white rounded-2xl shadow border border-gray-100 p-4 sm:p-0 overflow-hidden">
        
        <!-- MOBILE VIEW (CARD) -->
        <div id="card-tabel-siswa" class="block sm:hidden space-y-3">
          <p class="text-center py-6 text-gray-400">Memuat data...</p>
        </div>

        <!-- DESKTOP VIEW (TABLE) -->
        <div class="hidden sm:block overflow-x-auto">
          <table class="w-full text-sm">
            <thead class="bg-emerald-50 text-emerald-800">
              <tr>
                <th class="text-left px-4 py-3 font-semibold">Nama Siswa</th>
                <th class="text-left px-4 py-3 font-semibold">Kelas</th>
                <th class="text-right px-4 py-3 font-semibold">Aksi</th>
              </tr>
            </thead>
            <tbody id="tabel-body" class="divide-y divide-gray-100">
              <tr>
                <td colspan="3" class="text-center py-6 text-gray-400">Memuat data...</td>
              </tr>
            </tbody>
          </table>
        </div>

      </div>
    </main>

    <script src="assets/js/supabase-client.js"></script>
    <script src="assets/js/offline-store.js"></script>
    <script src="assets/js/app.js"></script>
    <script>
      async function init() {
        const session = await requireAuth();
        if (!session) return;

        initNetworkStatus("status-jaringan");
        perbaruiInfoAntrean();
        await muatDaftarSiswa();

        if (navigator.onLine) {
          supabase.channel("realtime-siswa").on("postgres_changes", { event: "*", schema: "public", table: "tabel_siswa" }, muatDaftarSiswa).subscribe();
        }
      }

      function perbaruiInfoAntrean() {
        const info = document.getElementById("antrean-info");
        const jumlah = jumlahAntreanOffline();
        if (jumlah > 0) {
          info.textContent = `⚠️ ${jumlah} perubahan menunggu disinkronkan saat online.`;
          info.classList.remove("hidden");
        } else {
          info.classList.add("hidden");
        }
      }

      async function muatDaftarSiswa() {
        const tbody = document.getElementById("tabel-body");
        const cardContainer = document.getElementById("card-tabel-siswa");
        
        const data = await dbSelect("tabel_siswa");
        data.sort((a, b) => (a.nama_siswa || "").localeCompare(b.nama_siswa || ""));

        if (!data || data.length === 0) {
          tbody.innerHTML = `<tr><td colspan="3" class="text-center py-6 text-gray-400">Belum ada data siswa.</td></tr>`;
          cardContainer.innerHTML = `<p class="text-center py-6 text-gray-400">Belum ada data siswa.</p>`;
          return;
        }

        // Render Desktop Table
        tbody.innerHTML = data
          .map(
            (s) => `
      <tr>
        <td class="px-4 py-3">${escapeHtml(s.nama_siswa)}${s._pending ? ' <span class="text-xs text-amber-600">(belum sinkron)</span>' : ""}</td>
        <td class="px-4 py-3">${escapeHtml(s.kelas)}</td>
        <td class="px-4 py-3 text-right space-x-2">
          <button onclick='bukaModal(${JSON.stringify({ id: s.id, nama_siswa: s.nama_siswa, kelas: s.kelas })})' class="text-emerald-700 font-semibold hover:underline">Edit</button>
          <button onclick="hapusSiswa('${s.id}')" class="text-red-600 font-semibold hover:underline">Hapus</button>
        </td>
      </tr>
    `,
          )
          .join("");

        // Render Mobile Cards
        cardContainer.innerHTML = data
          .map((s) => {
            const safeItem = JSON.stringify({ id: s.id, nama_siswa: s.nama_siswa, kelas: s.kelas }).replace(/"/g, '&quot;');
            return `
      <div class="bg-gray-50 border border-gray-200 p-3.5 rounded-xl flex justify-between items-center">
        <div>
          <p class="font-bold text-gray-800 text-sm">${escapeHtml(s.nama_siswa)} ${s._pending ? '<span class="text-xs text-amber-600">(pending)</span>' : ""}</p>
          <p class="text-xs text-gray-500 mt-0.5">Kelas: ${escapeHtml(s.kelas)}</p>
        </div>
        <div class="flex gap-2 text-xs font-semibold">
          <button onclick='bukaModal(${safeItem})' class="text-emerald-700 bg-emerald-50 px-2.5 py-1.5 rounded-md border border-emerald-200">Edit</button>
          <button onclick="hapusSiswa('${s.id}')" class="text-red-600 bg-red-50 px-2.5 py-1.5 rounded-md border border-red-200">Hapus</button>
        </div>
      </div>
    `;
          })
          .join("");
      }

      function escapeHtml(str) {
        return String(str).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
      }

      // Handler Tambah Siswa Baru
      document.getElementById("form-siswa").addEventListener("submit", async (e) => {
        e.preventDefault();
        const nama_siswa = document.getElementById("nama_siswa").value.trim();
        const kelas = document.getElementById("kelas").value.trim();

        await dbInsert("tabel_siswa", { nama_siswa, kelas });
        document.getElementById("form-siswa").reset();
        perbaruiInfoAntrean();
        muatDaftarSiswa();
      });

      // Kontrol Modal Popup Edit
      function bukaModal(siswa) {
        document.getElementById("edit_id").value = siswa.id;
        document.getElementById("edit_nama").value = siswa.nama_siswa;
        document.getElementById("edit_kelas").value = siswa.kelas;
        document.getElementById("modal-edit").classList.remove("hidden");
      }

      function tutupModal() {
        document.getElementById("modal-edit").classList.add("hidden");
      }

      // Handler Update data dari dalam Modal
      document.getElementById("form-edit").addEventListener("submit", async (e) => {
        e.preventDefault();
        const id = document.getElementById("edit_id").value;
        const nama_siswa = document.getElementById("edit_nama").value.trim();
        const kelas = document.getElementById("edit_kelas").value.trim();

        await dbUpdate("tabel_siswa", id, { nama_siswa, kelas });
        tutupModal();
        perbaruiInfoAntrean();
        muatDaftarSiswa();
      });

      async function hapusSiswa(id) {
        if (!confirm("Hapus data siswa ini? Data absensi terkait juga akan terhapus.")) return;
        await dbDelete("tabel_siswa", id);
        perbaruiInfoAntrean();
        muatDaftarSiswa();
      }

      init();
    </script>
  </body>
</html>
