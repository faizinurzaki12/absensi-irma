<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Export Laporan - Absensi IRMA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 1. CDN Pustaka Resmi Supabase dengan versi stabil -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.8"></script>
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body class="bg-gray-50 min-h-screen">
    <header class="bg-emerald-600 text-white shadow-md">
      <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between flex-wrap gap-2">
        <div class="flex items-center gap-2 font-bold text-lg">🕌 Absensi IRMA</div>
        <nav class="flex items-center gap-1 text-sm flex-wrap">
          <a href="users.html" class="px-3 py-1.5 rounded-lg hover:bg-emerald-700 transisi">Akun</a>
          <a href="siswa.html" class="px-3 py-1.5 rounded-lg hover:bg-emerald-700 transisi">Siswa</a>
          <a href="tambah.html" class="px-3 py-1.5 rounded-lg hover:bg-emerald-700 transisi">Input Absensi</a>
          <a href="edit.html" class="px-3 py-1.5 rounded-lg hover:bg-emerald-700 transisi">Rekap</a>
          <a href="export.html" class="px-3 py-1.5 rounded-lg bg-emerald-700 font-semibold">Export</a>
          <button onclick="logout()" class="px-3 py-1.5 rounded-lg bg-red-500 hover:bg-red-600 font-semibold transisi">Logout</button>
        </nav>
      </div>
    </header>

    <main class="max-w-lg mx-auto px-4 py-8">
      <h1 class="text-2xl font-bold text-gray-800 mb-6">Export Laporan Absensi</h1>

      <div class="bg-white rounded-2xl shadow p-6 border border-gray-100 text-center">
        <p class="text-sm text-gray-500 mb-1">Total Data Absensi Tercatat</p>
        <p id="total-absensi" class="text-4xl font-bold text-emerald-700 mb-6">-</p>

        <button id="btn-export" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 rounded-lg transisi">⬇️ Download Laporan Excel</button>
        <p id="pesan-export" class="text-sm text-gray-400 mt-3 hidden"></p>
      </div>
    </main>
    <!-- CDN SheetJS untuk Export ke Excel (.xlsx) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- 2. Skrip Inisialisasi Klien (Harus di atas sebelum digunakan) -->
    <script src="assets/js/supabase-client.js"></script>
    <script src="assets/js/app.js"></script>
    <script>
      let semuaData = [];

      async function init() {
        const session = await requireAuth();
        if (!session) return;

        const { data, error } = await supabase.from("tabel_absensi").select("tanggal_kegiatan, status_kehadiran, tabel_siswa(nama_siswa, kelas)").order("tanggal_kegiatan", { ascending: false });

        if (error) {
          document.getElementById("total-absensi").textContent = "Error";
          return;
        }

        semuaData = data || [];
        document.getElementById("total-absensi").textContent = semuaData.length;
      }

      document.getElementById("btn-export").addEventListener("click", () => {
        if (semuaData.length === 0) {
          alert("Belum ada data absensi untuk diekspor.");
          return;
        }

        const tanggalSekarang = new Date().toISOString().slice(0, 10);
        const namaFile = `laporan_absensi_irma_${tanggalSekarang}.xlsx`;

        // Panggil fungsi unduhExcel
        unduhExcel(namaFile, semuaData);

        const pesan = document.getElementById("pesan-export");
        pesan.textContent = `File "${namaFile}" berhasil diunduh.`;
        pesan.classList.remove("hidden");
      });

      init();
    </script>
  </body>
</html>
