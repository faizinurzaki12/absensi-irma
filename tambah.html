<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Input Absensi - Absensi IRMA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.8"></script>
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body class="bg-gray-50 min-h-screen">
    <header class="bg-emerald-600 text-white shadow-md">
      <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between flex-wrap gap-2">
        <div class="flex items-center gap-2 font-bold text-lg">🕌 Absensi IRMA</div>
        <nav class="flex items-center gap-1 text-sm flex-wrap">
          <a href="/users" class="px-3 py-1.5 rounded-lg hover:bg-emerald-700 transisi">Akun</a>
          <a href="/siswa" class="px-3 py-1.5 rounded-lg hover:bg-emerald-700 transisi">Siswa</a>
          <a href="/tambah" class="px-3 py-1.5 rounded-lg bg-emerald-700 font-semibold">Input Absensi</a>
          <a href="/rekap" class="px-3 py-1.5 rounded-lg hover:bg-emerald-700 transisi">Rekap</a>
          <a href="/export" class="px-3 py-1.5 rounded-lg hover:bg-emerald-700 transisi">Export</a>
          <button onclick="logout()" class="px-3 py-1.5 rounded-lg bg-red-500 hover:bg-red-600 font-semibold transisi">Logout</button>
        </nav>
      </div>
    </header>

    <main class="max-w-lg mx-auto px-4 py-8">
      <div class="flex items-center justify-between mb-6">
        <h1 class="text-2xl font-bold text-gray-800">Input Absensi Harian</h1>
        <span id="status-jaringan" class="text-sm font-semibold text-emerald-700 bg-emerald-50 px-3 py-1 rounded-full">🌐 Online</span>
      </div>

      <div id="sync-notif" class="hidden mb-4 bg-emerald-50 text-emerald-700 text-sm px-4 py-2 rounded-lg border border-emerald-200"></div>
      <div id="antrean-info" class="hidden mb-4 bg-amber-50 text-amber-700 text-sm px-4 py-2 rounded-lg border border-amber-200"></div>

      <div class="bg-white rounded-2xl shadow p-6 border border-gray-100">
        <form id="form-absensi" class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Tanggal Kegiatan</label>
            <input type="date" id="tanggal_kegiatan" required class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-emerald-600 transisi" />
          </div>

          <!-- Dropdown siswa custom (bukan <select> native) agar arah bukanya selalu ke bawah -->
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Pilih Siswa</label>
            <div class="relative">
              <button
                type="button"
                id="siswa-trigger"
                class="w-full flex items-center justify-between border border-gray-300 rounded-lg px-3 py-2 bg-white text-left focus:outline-none focus:ring-2 focus:ring-emerald-600 transisi"
              >
                <span id="siswa-label" class="text-gray-400 truncate">Memuat daftar siswa...</span>
                <svg class="w-4 h-4 text-gray-400 shrink-0 ml-2" viewBox="0 0 20 20" fill="currentColor">
                  <path fill-rule="evenodd" d="M5.23 7.21a.75.75 0 011.06.02L10 11.168l3.71-3.938a.75.75 0 111.08 1.04l-4.25 4.5a.75.75 0 01-1.08 0l-4.25-4.5a.75.75 0 01.02-1.06z" clip-rule="evenodd" />
                </svg>
              </button>
              <input type="hidden" id="siswa_id" required />

              <!-- Panel dropdown: absolute + top-full = selalu nempel & terbuka DI BAWAH tombol -->
              <div id="siswa-dropdown" class="hidden absolute left-0 right-0 top-full mt-1 bg-white border border-gray-200 rounded-lg shadow-lg max-h-56 overflow-y-auto z-20"></div>
            </div>
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Status Kehadiran</label>
            <select id="status_kehadiran" required class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-emerald-600 transisi">
              <option value="Hadir">Hadir</option>
              <option value="Sakit">Sakit</option>
              <option value="Izin">Izin</option>
              <option value="Alfa">Alfa</option>
            </select>
          </div>
          <p id="pesan-status" class="text-sm hidden"></p>
          <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 rounded-lg transisi">Simpan Absensi</button>
        </form>
      </div>
    </main>

    <script src="assets/js/supabase-client.js"></script>
    <script src="assets/js/offline-store.js"></script>
    <script src="assets/js/app.js"></script>
    <script>
      let daftarSiswaCache = [];

      async function init() {
        const session = await requireAuth();
        if (!session) return;

        initNetworkStatus("status-jaringan");
        perbaruiInfoAntrean();
        await muatDaftarSiswa();
        initDropdownSiswa();
      }

      function escapeHtml(str) {
        return String(str).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
      }

      async function muatDaftarSiswa() {
        const dropdown = document.getElementById("siswa-dropdown");
        const label = document.getElementById("siswa-label");
        const data = await dbSelect("tabel_siswa");
        data.sort((a, b) => (a.nama_siswa || "").localeCompare(b.nama_siswa || ""));
        daftarSiswaCache = data;

        if (!data || data.length === 0) {
          label.textContent = "Belum ada data siswa";
          dropdown.innerHTML = `<div class="px-3 py-2 text-sm text-gray-400">Belum ada data siswa - tambahkan dulu di menu Siswa</div>`;
          return;
        }

        dropdown.innerHTML = data
          .map(
            (s) => `
      <button type="button" data-id="${s.id}" class="opsi-siswa w-full text-left px-3 py-2 text-sm hover:bg-emerald-50 transisi">
        ${escapeHtml(s.nama_siswa)} - ${escapeHtml(s.kelas)}${s._pending ? ' <span class="text-xs text-amber-600">(belum sinkron)</span>' : ""}
      </button>`,
          )
          .join("");

        dropdown.querySelectorAll(".opsi-siswa").forEach((btn) => {
          btn.addEventListener("click", () => pilihSiswa(btn.dataset.id));
        });

        // Otomatis pilih siswa pertama biar form langsung siap dipakai
        pilihSiswa(data[0].id);
      }

      function pilihSiswa(id) {
        const siswa = daftarSiswaCache.find((s) => String(s.id) === String(id));
        if (!siswa) return;
        document.getElementById("siswa_id").value = siswa.id;
        const label = document.getElementById("siswa-label");
        label.textContent = `${siswa.nama_siswa} - ${siswa.kelas}`;
        label.classList.remove("text-gray-400");
        document.getElementById("siswa-dropdown").classList.add("hidden");
      }

      function initDropdownSiswa() {
        const trigger = document.getElementById("siswa-trigger");
        const dropdown = document.getElementById("siswa-dropdown");

        trigger.addEventListener("click", () => {
          dropdown.classList.toggle("hidden");
        });

        document.addEventListener("click", (e) => {
          if (!trigger.contains(e.target) && !dropdown.contains(e.target)) {
            dropdown.classList.add("hidden");
          }
        });
      }

      function perbaruiInfoAntrean() {
        const info = document.getElementById("antrean-info");
        const jumlah = jumlahAntreanOffline();
        if (jumlah > 0) {
          info.textContent = `⚠️ ${jumlah} perubahan menunggu disinkronkan saat online.`;
          info.classList.remove("hidden");
        } else {
          info.classList.add("hidden");
        }
      }

      document.getElementById("form-absensi").addEventListener("submit", async (e) => {
        e.preventDefault();
        const pesan = document.getElementById("pesan-status");

        const payload = {
          tanggal_kegiatan: document.getElementById("tanggal_kegiatan").value,
          siswa_id: document.getElementById("siswa_id").value,
          status_kehadiran: document.getElementById("status_kehadiran").value,
        };

        if (!payload.siswa_id) {
          alert("Pilih siswa terlebih dahulu.");
          return;
        }

        await dbInsert("tabel_absensi", payload);

        pesan.classList.remove("hidden");
        if (navigator.onLine) {
          pesan.textContent = "✅ Absensi berhasil disimpan.";
          pesan.className = "text-sm text-emerald-700";
        } else {
          pesan.textContent = "📴 Offline: absensi disimpan di perangkat, akan otomatis terkirim saat online.";
          pesan.className = "text-sm text-amber-600";
        }

        perbaruiInfoAntrean();
        // Tanggal sengaja tidak direset agar mudah input siswa berikutnya di hari yang sama
        if (daftarSiswaCache.length > 0) pilihSiswa(daftarSiswaCache[0].id);
      });

      init();
    </script>
  </body>
</html>
