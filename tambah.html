<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Input Absensi - Absensi IRMA</title>
    <script src="https://cdn.tailwindcss.com"></script>
        <!-- 1. CDN Pustaka Resmi Supabase dengan versi stabil -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.8"></script>
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body class="bg-gray-50 min-h-screen">
    <header class="bg-emerald-600 text-white shadow-md">
      <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between flex-wrap gap-2">
        <div class="flex items-center gap-2 font-bold text-lg">🕌 Absensi IRMA</div>
        <nav class="flex items-center gap-1 text-sm flex-wrap">
          <a href="users.html" class="px-3 py-1.5 rounded-lg hover:bg-emerald-700 transisi">Akun</a>
          <a href="siswa.html" class="px-3 py-1.5 rounded-lg hover:bg-emerald-700 transisi">Siswa</a>
          <a href="tambah.html" class="px-3 py-1.5 rounded-lg bg-emerald-700 font-semibold">Input Absensi</a>
          <a href="edit.html" class="px-3 py-1.5 rounded-lg hover:bg-emerald-700 transisi">Rekap</a>
          <a href="export.html" class="px-3 py-1.5 rounded-lg hover:bg-emerald-700 transisi">Export</a>
          <button onclick="logout()" class="px-3 py-1.5 rounded-lg bg-red-500 hover:bg-red-600 font-semibold transisi">Logout</button>
        </nav>
      </div>
    </header>

    <main class="max-w-lg mx-auto px-4 py-8">
      <div class="flex items-center justify-between mb-6">
        <h1 class="text-2xl font-bold text-gray-800">Input Absensi Harian</h1>
        <span id="status-jaringan" class="text-sm font-semibold text-emerald-700 bg-emerald-50 px-3 py-1 rounded-full">🌐 Online</span>
      </div>

      <div id="sync-notif" class="hidden mb-4 bg-emerald-50 text-emerald-700 text-sm px-4 py-2 rounded-lg border border-emerald-200"></div>

      <div id="antrean-info" class="hidden mb-4 bg-amber-50 text-amber-700 text-sm px-4 py-2 rounded-lg border border-amber-200"></div>

      <div class="bg-white rounded-2xl shadow p-6 border border-gray-100">
        <form id="form-absensi" class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Tanggal Kegiatan</label>
            <input type="date" id="tanggal_kegiatan" required class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-emerald-600 transisi" />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Pilih Siswa</label>
            <select id="siswa_id" required class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-emerald-600 transisi">
              <option value="siswa_id">Memuat daftar siswa...</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Status Kehadiran</label>
            <select id="status_kehadiran" required class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-emerald-600 transisi">
              <option value="Hadir">Hadir</option>
              <option value="Sakit">Sakit</option>
              <option value="Izin">Izin</option>
              <option value="Alfa">Alfa</option>
            </select>
          </div>
          <p id="pesan-status" class="text-sm hidden"></p>
          <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 rounded-lg transisi">Simpan Absensi</button>
        </form>
      </div>
    </main>
    <!-- 2. Skrip Inisialisasi Klien (Harus di atas sebelum digunakan) -->
    <script src="assets/js/supabase-client.js"></script>
    <script src="assets/js/app.js"></script>
    <script>
      let daftarSiswaCache = [];

      async function init() {
        const session = await requireAuth();
        if (!session) return;

        initNetworkStatus("status-jaringan");
        perbaruiInfoAntrean();

        const { data, error } = await supabase.from("tabel_siswa").select("id, nama_siswa, kelas").order("nama_siswa");
        const select = document.getElementById("siswa_id");

        if (error || !data || data.length === 0) {
          select.innerHTML = `<option value="">Belum ada data siswa - tambahkan dulu di menu Siswa</option>`;
          return;
        }

        daftarSiswaCache = data;
        select.innerHTML = data.map((s) => `<option value="${s.id}">${s.nama_siswa} - ${s.kelas}</option>`).join("");
      }

      function perbaruiInfoAntrean() {
        const info = document.getElementById("antrean-info");
        const jumlah = jumlahAntreanOffline();
        if (jumlah > 0) {
          info.textContent = `⚠️ ${jumlah} data absensi menunggu disinkronkan saat online.`;
          info.classList.remove("hidden");
        } else {
          info.classList.add("hidden");
        }
      }

      document.getElementById("form-absensi").addEventListener("submit", async (e) => {
        e.preventDefault();
        const pesan = document.getElementById("pesan-status");

        const payload = {
          tanggal_kegiatan: document.getElementById("tanggal_kegiatan").value,
          siswa_id: document.getElementById("siswa_id").value,
          status_kehadiran: document.getElementById("status_kehadiran").value,
        };

        if (!payload.siswa_id) {
          alert("Pilih siswa terlebih dahulu.");
          return;
        }

        pesan.classList.remove("hidden");

        if (!navigator.onLine) {
          tambahKeAntreanOffline(payload);
          pesan.textContent = "📴 Offline: data absensi disimpan sementara di perangkat, akan otomatis terkirim saat online.";
          pesan.className = "text-sm text-amber-600";
          perbaruiInfoAntrean();
          // Tanggal sengaja tidak direset agar mudah input siswa berikutnya di hari yang sama
          document.getElementById("siswa_id").selectedIndex = 0;
          return;
        }

        const { error } = await supabase.from("tabel_absensi").insert(payload);

        if (error) {
          // fallback: kalau gagal karena gangguan koneksi mendadak, simpan ke antrean offline juga
          tambahKeAntreanOffline(payload);
          pesan.textContent = "⚠️ Gagal kirim langsung, data diamankan ke antrean offline: " + error.message;
          pesan.className = "text-sm text-amber-600";
          perbaruiInfoAntrean();
        } else {
          pesan.textContent = "✅ Absensi berhasil disimpan.";
          pesan.className = "text-sm text-emerald-700";
        }

        document.getElementById("siswa_id").selectedIndex = 0;
      });

      init();
    </script>
  </body>
</html>
